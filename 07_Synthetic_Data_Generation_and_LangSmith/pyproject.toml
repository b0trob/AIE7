[project]
name = "synthetic-data-generation-demo"
version = "0.1.0"
description = "Demo for synthetic data generation using RAGAS and LangSmith evaluation"
authors = [
    {name = "AI Boot Camp", email = "demo@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ragas==0.2.10",
    "langchain-community==0.3.14",
    "langchain-openai==0.2.14",
    "langgraph==0.2.61",
    "langchain-qdrant==0.2.0",
    "langsmith",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
